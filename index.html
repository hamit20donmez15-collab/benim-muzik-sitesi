<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Müzik İndirici</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { max-width: 800px; margin: 2rem auto; padding: 0 1rem; background: #f5f5f5; }
        h1 { color: #ff0000; text-align: center; }
        .search-box { display: flex; gap: 0.5rem; margin: 2rem 0; }
        input { flex: 1; padding: 0.75rem; font-size: 1rem; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 0.75rem 1.5rem; background: #ff0000; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #cc0000; }
        .result-item { background: white; padding: 1rem; margin: 0.5rem 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .info { flex: 1; }
        .title { font-weight: bold; margin-bottom: 0.25rem; }
        .small { color: #666; font-size: 0.9rem; }
        .download-btn { background: #28a745; padding: 0.5rem 1rem; }
        .download-btn:hover { background: #218838; }
        .message { margin-top: 1rem; padding: 0.75rem; border-radius: 4px; display: none; }
        .success { background: #d4edda; color: #155724; display: block; }
        .error { background: #f8d7da; color: #721c24; display: block; }
    </style>
</head>
<body>
    <h1>🎵 YouTube MP3 İndirici</h1>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Şarkı adı veya YouTube bağlantısı yazın...">
        <button onclick="searchVideo()">Ara</button>
    </div>

    <div id="message" class="message"></div>
    <div id="results"></div>

    <script>
        async function searchVideo() {
            const q = document.getElementById("searchInput").value;
            const res = await fetch("/api/search", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({query: q})
            });
            const data = await res.json();
            
            const msg = document.getElementById("message");
            const list = document.getElementById("results");
            list.innerHTML = "";
            msg.className = "message";

            if (data.status === "error") {
                msg.textContent = data.message;
                msg.classList.add("error");
                return;
            }

            data.results.forEach(item => {
                const div = document.createElement("div");
                div.className = "result-item";
                div.innerHTML = `
                    <div class="info">
                        <div class="title">${item.title}</div>
                        <div class="small">${item.uploader} • ${Math.floor(item.duration/60)}:${String(item.duration%60).padStart(2,'0')}</div>
                    </div>
                    <button class="download-btn" onclick="startDownload('${item.url}')">İndir</button>
                `;
                list.appendChild(div);
            });
        }

        async function startDownload(url) {
            const res = await fetch("/api/download", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({url: url})
            });
            const data = await res.json();
            
            const msg = document.getElementById("message");
            msg.className = "message";
            
            if (data.status === "success") {
                msg.textContent = "İndirme tamamlandı!";
                msg.classList.add("success");
                setTimeout(() => window.location.href = `/downloads/${data.data.filename}`, 1000);
            } else {
                msg.textContent = "Hata: " + data.message;
                msg.classList.add("error");
            }
        }
    </script>
</body>
</html>
