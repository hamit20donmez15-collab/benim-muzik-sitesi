<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş Yönetici Paneli</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background-color: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); width: 100%; max-width: 700px; }
        h1, h2 { text-align: center; color: #1db954; margin-top: 0; }
        label { font-size: 14px; color: #b3b3b3; display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"], select { width: 100%; padding: 12px 15px; margin-bottom: 15px; border: 1px solid #333; background-color: #2a2a2a; color: white; border-radius: 6px; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #1db954; }
        
        button { width: 100%; padding: 12px; background-color: #1db954; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; transition: background 0.2s; }
        button:hover { background-color: #1ed760; }
        button:disabled { background-color: #444; cursor: not-allowed; }
        
        .btn-blue { background-color: #2980b9; } .btn-blue:hover { background-color: #3498db; }
        .btn-red { background-color: #c0392b; } .btn-red:hover { background-color: #e74c3c; }

        .status-msg { margin: 15px 0; padding: 10px; border-radius: 6px; text-align: center; font-size: 14px; display: none; }
        .success { color: #1db954; background: rgba(29, 185, 84, 0.1); display: block; }
        .error { color: #ff4d4d; background: rgba(255, 77, 77, 0.1); display: block; }
        .loading { color: #ffeb3b; background: rgba(255, 235, 59, 0.1); display: block; }

        /* Gelişmiş Arama Sonuçları */
        .search-results { max-height: 300px; overflow-y: auto; margin-top: 10px; background: #252525; padding: 10px; border-radius: 6px; border: 1px solid #333; }
        .result-item { display: flex; align-items: center; background: #2a2a2a; padding: 10px; margin-bottom: 6px; border-radius: 4px; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        .result-item:hover { background: #333; }
        .result-item input[type="checkbox"] { margin-right: 12px; width: 18px; height: 18px; cursor: pointer; }
        .result-info { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .result-channel { font-size: 11px; color: #aaa; display: block; }
        .status-badge { font-size: 11px; padding: 3px 6px; border-radius: 4px; margin-left: 10px; display: none; }

        .song-list { margin-top: 15px; max-height: 250px; overflow-y: auto; }
        .song-item { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px 12px; margin-bottom: 8px; border-radius: 6px; }
        .song-info { max-width: 75%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .song-title { font-size: 14px; font-weight: bold; color: #fff; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="loginSection" class="container">
        <h1>🔒 Yönetici Girişi</h1>
        <input type="password" id="adminPassword" placeholder="Şifreniz...">
        <button onclick="login()">Giriş Yap</button>
        <div id="loginMessage" class="status-msg"></div>
    </div>

    <div id="panelSection" class="container" style="display: none;">
        <div class="top-bar">
            <h2>🎵 Gelişmiş Şarkı Paneli</h2>
            <button class="btn-red" style="width: auto; padding: 8px 15px; font-size: 13px;" onclick="logout()">Çıkış</button>
        </div>

        <div style="background: #222; padding: 15px; border-radius: 8px; border: 1px solid #333;">
            <label for="searchQuery">Grup / Sanatçı / Şarkı Ara:</label>
            <input type="text" id="searchQuery" placeholder="Örn: Manifest albüm...">
            
            <label for="resultLimit">Kaç sonuç listelensin?</label>
            <select id="resultLimit">
                <option value="5">5 Şarkı</option>
                <option value="10" selected>10 Şarkı</option>
                <option value="15">15 Şarkı</option>
                <option value="25">25 Şarkı</option>
            </select>
            
            <button onclick="searchYouTube()" id="searchBtn">🔍 YouTube'da Bul</button>
            <div id="statusMessage" class="status-msg"></div>
        </div>

        <!-- SEÇMELİ İNDİRME ALANI -->
        <div id="resultsContainer" style="display:none; margin-top: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin:0; font-size: 15px;">Bulunan Şarkılar</h3>
                <label style="cursor: pointer; font-size: 13px; color: #1db954;">
                    <input type="checkbox" id="selectAll" onclick="toggleSelectAll()" style="vertical-align: middle;"> Tümünü Seç
                </label>
            </div>
            
            <div id="searchResults" class="search-results"></div>
            
            <button class="btn-blue" onclick="downloadSelected()" id="downloadBtn" style="margin-top: 15px;">⬇️ Seçilenleri Arşive Ekle</button>
        </div>

        <hr style="border-color: #444; margin: 30px 0;">

        <!-- ARŞİV YÖNETİMİ -->
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0; font-size:16px;">Mevcut Arşiv</h3>
            <button class="btn-red" onclick="clearAllSongs()" style="width:auto; padding:6px 12px; font-size:12px;">⚠️ Tüm Arşivi Sıfırla</button>
        </div>

        <div id="songList" class="song-list"></div>

        <br>
        <a href="/" style="color: #1db954; text-decoration: none; display: block; text-align: center; font-size: 14px;">← Ana Sayfaya Dön</a>
    </div>

    <script>
        let currentResults = [];

        window.onload = () => { if (localStorage.getItem("adminAuth") === "true") showPanel(); };

        async function login() {
            const pass = document.getElementById("adminPassword").value;
            const msg = document.getElementById("loginMessage");
            try {
                const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pass }) });
                const data = await res.json();
                if (data.success) { localStorage.setItem("adminAuth", "true"); showPanel(); } 
                else { msg.className = "status-msg error"; msg.innerText = "Hatalı Şifre!"; }
            } catch (err) { msg.className = "status-msg error"; msg.innerText = "Bağlantı hatası!"; }
        }

        function logout() { localStorage.removeItem("adminAuth"); location.reload(); }

        function showPanel() {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("panelSection").style.display = "block";
            loadSongs();
        }

        async function searchYouTube() {
            const query = document.getElementById('searchQuery').value.trim();
            const limit = document.getElementById('resultLimit').value;
            const msg = document.getElementById('statusMessage');
            const btn = document.getElementById('searchBtn');

            if (!query) return;

            msg.className = 'status-msg loading'; msg.innerHTML = '⏳ Aranıyor...'; btn.disabled = true;
            document.getElementById('resultsContainer').style.display = 'none';
            document.getElementById('selectAll').checked = false;

            try {
                const res = await fetch('/api/search-youtube', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query, limit: parseInt(limit) }) });
                const data = await res.json();

                if (data.success) {
                    currentResults = data.results;
                    renderSearchResults();
                    msg.style.display = 'none';
                    document.getElementById('resultsContainer').style.display = 'block';
                } else {
                    msg.className = 'status-msg error'; msg.innerHTML = '❌ ' + data.message;
                }
            } catch (err) {
                msg.className = 'status-msg error'; msg.innerHTML = '❌ Hata oluştu.';
            } finally { btn.disabled = false; }
        }

        function renderSearchResults() {
            const container = document.getElementById('searchResults');
            if (currentResults.length === 0) { container.innerHTML = '<p style="text-align:center; color:#aaa;">Sonuç bulunamadı.</p>'; return; }
            
            container.innerHTML = currentResults.map((s, i) => `
                <label class="result-item" for="chk_${i}">
                    <input type="checkbox" id="chk_${i}" class="song-checkbox" value="${i}">
                    <div class="result-info">
                        <strong>${s.title}</strong>
                        <span class="result-channel">${s.channel}</span>
                    </div>
                    <span id="badge_${i}" class="status-badge"></span>
                </label>
            `).join('');
        }

        function toggleSelectAll() {
            const isChecked = document.getElementById('selectAll').checked;
            document.querySelectorAll('.song-checkbox').forEach(cb => cb.checked = isChecked);
        }

        async function downloadSelected() {
            const checkboxes = document.querySelectorAll('.song-checkbox:checked');
            if (checkboxes.length === 0) return alert("Lütfen indirilecek en az bir şarkı seçin!");

            const btn = document.getElementById('downloadBtn');
            btn.disabled = true;
            btn.innerText = "⏳ İndiriliyor, lütfen bekleyin...";

            for (let cb of checkboxes) {
                const index = cb.value;
                const song = currentResults[index];
                const badge = document.getElementById(`badge_${index}`);
                
                badge.style.display = "block";
                badge.style.background = "#f39c12";
                badge.style.color = "#fff";
                badge.innerText = "İndiriliyor...";

                try {
                    const res = await fetch('/api/download-song', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: song.url })
                    });
                    const data = await res.json();
                    
                    if (data.success) {
                        badge.style.background = "#27ae60"; badge.innerText = "Eklendi";
                        cb.disabled = true; // İnenin tikini kitle
                    } else {
                        badge.style.background = "#c0392b"; badge.innerText = "Hata";
                    }
                } catch (e) {
                    badge.style.background = "#c0392b"; badge.innerText = "Hata";
                }
            }

            btn.disabled = false;
            btn.innerText = "⬇️ Seçilenleri Arşive Ekle";
            loadSongs(); // Arşivi yenile
        }

        async function loadSongs() {
            const listDiv = document.getElementById("songList");
            try {
                const res = await fetch('/api/songs');
                const songs = await res.json();
                
                if (songs.length === 0) { listDiv.innerHTML = '<p style="color: #aaa; text-align: center;">Arşiv temiz.</p>'; return; }

                listDiv.innerHTML = songs.map(song => `
                    <div class="song-item">
                        <div class="song-info">
                            <div class="song-title">${song.title}</div>
                        </div>
                        <button class="btn-red" style="width:auto; padding:5px 10px;" onclick="deleteSong('${song.id}')">Sil</button>
                    </div>
                `).join('');
            } catch (err) { listDiv.innerHTML = '<p style="color: red;">Yüklenemedi.</p>'; }
        }

        async function deleteSong(id) {
            if(!confirm("Silinsin mi?")) return;
            await fetch(`/api/delete-song/${id}`, { method: 'DELETE' });
            loadSongs();
        }

        async function clearAllSongs() {
            if(!confirm("DİKKAT! Tüm şarkılar kalıcı olarak silinecek. Emin misin?")) return;
            await fetch('/api/clear-all', { method: 'DELETE' });
            loadSongs();
        }
    </script>
</body>
</html>
