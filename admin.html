<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Paneli - Şarkı Ekle</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #1db954;
        }
        p.description {
            text-align: center;
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #1db954;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1db954;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background-color: #1ed760;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
        }
        .success { color: #1db954; background-color: rgba(29, 185, 84, 0.1); }
        .error { color: #ff4d4d; background-color: rgba(255, 77, 77, 0.1); }
        .loading { color: #ffeb3b; background-color: rgba(255, 235, 59, 0.1); }
        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #b3b3b3;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 Yönetici Paneli</h1>
        <p class="description">Sisteme yeni şarkı eklemek için YouTube linkini aşağıya yapıştır.</p>
        
        <input type="text" id="songUrl" placeholder="Örn: https://www.youtube.com/watch?v=...">
        <button id="addBtn" onclick="addSong()">İndir ve Ekle</button>
        
        <div id="message" style="display: none;"></div>
        
        <a href="/" class="back-link">← Ana Sayfaya Dön (Siteyi Gör)</a>
    </div>

    <script>
        async function addSong() {
            const urlInput = document.getElementById('songUrl').value.trim();
            const messageDiv = document.getElementById('message');
            const btn = document.getElementById('addBtn');

            // Mesaj alanını temizle ve göster
            messageDiv.style.display = 'block';

            if (!urlInput) {
                messageDiv.innerHTML = 'Lütfen geçerli bir YouTube linki girin!';
                messageDiv.className = 'error';
                return;
            }

            // Butonu kitle ve yükleniyor animasyonu/metni ver
            btn.disabled = true;
            btn.innerText = "Şarkı Çekiliyor... (Bekleyin)";
            messageDiv.innerHTML = '⏳ Şarkı sunucuya indiriliyor, bu işlem şarkı uzunluğuna göre biraz sürebilir...';
            messageDiv.className = 'loading';

            try {
                const response = await fetch('/api/add-song', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();

                if (data.success) {
                    messageDiv.innerHTML = `✅ Başarılı! <strong>${data.song.title}</strong> sisteme eklendi.`;
                    messageDiv.className = 'success';
                    document.getElementById('songUrl').value = ''; // İşlem bitince kutuyu boşalt
                } else {
                    messageDiv.innerHTML = `❌ Hata: ${data.message}`;
                    messageDiv.className = 'error';
                }
            } catch (error) {
                messageDiv.innerHTML = '❌ Sunucuyla bağlantı kurulamadı. İnternetini veya sunucu durumunu kontrol et.';
                messageDiv.className = 'error';
            } finally {
                // İşlem bittiğinde butonu tekrar aktif et
                btn.disabled = false;
                btn.innerText = "İndir ve Ekle";
            }
        }
    </script>

</body>
</html>
