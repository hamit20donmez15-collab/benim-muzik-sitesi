<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Paneli</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 10px;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }
        h1, h2 { text-align: center; color: #1db954; margin-top: 0; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0 15px 0;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1db954;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }
        button:hover { background-color: #1ed760; }
        button.delete-btn {
            background-color: #e74c3c;
            width: auto;
            padding: 6px 12px;
            font-size: 13px;
        }
        button.delete-btn:hover { background-color: #c0392b; }
        #message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        .success { color: #1db954; background: rgba(29, 185, 84, 0.1); }
        .error { color: #ff4d4d; background: rgba(255, 77, 77, 0.1); }
        .loading { color: #ffeb3b; background: rgba(255, 235, 59, 0.1); }
        
        .song-list { margin-top: 20px; }
        .song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 5px;
        }
        .song-info { font-size: 14px; max-width: 80%; }
        .song-title { font-weight: bold; color: #fff; }
        .song-artist { font-size: 12px; color: #aaa; }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logout-btn {
            background: #444;
            width: auto;
            padding: 6px 12px;
        }
    </style>
</head>
<body>

    <!-- ŞİFRE GİRİŞ EKRANI -->
    <div id="loginSection" class="container">
        <h1>🔒 Admin Girişi</h1>
        <p style="text-align: center; color: #aaa;">Devam etmek için yönetici şifresini girin.</p>
        <input type="password" id="adminPassword" placeholder="Şifrenizi girin...">
        <button onclick="login()">Giriş Yap</button>
        <div id="loginMessage" id="message"></div>
    </div>

    <!-- PANEL EKRANI (GİRİŞ YAPILINCA AÇILIR) -->
    <div id="panelSection" class="container" style="display: none;">
        <div class="top-bar">
            <h2>🎵 Şarkı Yönetimi</h2>
            <button class="logout-btn" onclick="logout()">Çıkış</button>
        </div>

        <label style="font-weight: bold;">YouTube Şarkı Linki:</label>
        <input type="text" id="songUrl" placeholder="https://www.youtube.com/watch?v=...">
        <button id="addBtn" onclick="addSong()">Şarkıyı İndir ve Ekle</button>
        <div id="message"></div>

        <hr style="border-color: #333; margin: 25px 0;">

        <h3>Mevcut Şarkılar</h3>
        <div id="songList" class="song-list">
            <p style="color: #aaa;">Şarkılar yükleniyor...</p>
        </div>

        <br>
        <a href="/" style="color: #1db954; text-decoration: none; display: block; text-align: center;">← Ana Sayfaya Dön</a>
    </div>

    <script>
        const API_PASS = "182015hd";

        window.onload = function() {
            if (localStorage.getItem("adminAuth") === "true") {
                showPanel();
            }
        };

        async function login() {
            const pass = document.getElementById("adminPassword").value;
            const msg = document.getElementById("loginMessage");

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });

                const data = await res.json();
                if (data.success) {
                    localStorage.setItem("adminAuth", "true");
                    showPanel();
                } else {
                    msg.style.display = "block";
                    msg.className = "error";
                    msg.innerText = "Hatalı Şifre!";
                }
            } catch (err) {
                alert("Bağlantı hatası!");
            }
        }

        function logout() {
            localStorage.removeItem("adminAuth");
            document.getElementById("loginSection").style.display = "block";
            document.getElementById("panelSection").style.display = "none";
        }

        function showPanel() {
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("panelSection").style.display = "block";
            loadSongs();
        }

        async function addSong() {
            const urlInput = document.getElementById('songUrl').value.trim();
            const messageDiv = document.getElementById('message');
            const btn = document.getElementById('addBtn');

            if (!urlInput) return alert("URL girin!");

            messageDiv.style.display = 'block';
            messageDiv.className = 'loading';
            messageDiv.innerHTML = '⏳ Şarkı indiriliyor...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/add-song', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });
                const data = await res.json();

                if (data.success) {
                    messageDiv.className = 'success';
                    messageDiv.innerHTML = '✅ Şarkı başarıyla eklendi!';
                    document.getElementById('songUrl').value = '';
                    loadSongs();
                } else {
                    messageDiv.className = 'error';
                    messageDiv.innerHTML = '❌ Hata: ' + data.message;
                }
            } catch (err) {
                messageDiv.className = 'error';
                messageDiv.innerHTML = '❌ İndirme hatası!';
            } finally {
                btn.disabled = false;
            }
        }

        async function loadSongs() {
            const listDiv = document.getElementById("songList");
            try {
                const res = await fetch('/api/songs');
                const songs = await res.json();

                if (songs.length === 0) {
                    listDiv.innerHTML = '<p style="color: #aaa;">Henüz şarkı eklenmemiş.</p>';
                    return;
                }

                listDiv.innerHTML = songs.map(song => `
                    <div class="song-item">
                        <div class="song-info">
                            <div class="song-title">${song.title}</div>
                            <div class="song-artist">${song.artist || 'Bilinmeyen Sanatçı'}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteSong('${song.id}')">Sil</button>
                    </div>
                `).join('');
            } catch (err) {
                listDiv.innerHTML = '<p style="color: red;">Şarkılar yüklenemedi.</p>';
            }
        }

        async function deleteSong(songId) {
            if (!confirm("Bu şarkıyı silmek istediğinize emin misiniz?")) return;

            try {
                const res = await fetch(`/api/delete-song/${songId}`, { method: 'DELETE' });
                const data = await res.json();

                if (data.success) {
                    loadSongs();
                } else {
                    alert("Silinemedi: " + data.message);
                }
            } catch (err) {
                alert("Silme işleminde hata oluştu!");
            }
        }
    </script>
</body>
</html>
