<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetim Paneli</title>
    <style>
        body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; font-family: Arial, sans-serif; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f0f0f0; }
        a { color: #0066cc; text-decoration: none; }
        .back { display: inline-block; margin-bottom: 1rem; color: #666; }
    </style>
</head>
<body>
    <a href="/" class="back">← Ana Sayfa</a>
    <h2>📊 İndirilen Şarkılar</h2>
    <table id="songTable">
        <thead>
            <tr>
                <th>Şarkı Adı</th>
                <th>Kanal</th>
                <th>Tarih</th>
                <th>İndir</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        fetch("/api/songs")
            .then(r => r.json())
            .then(songs => {
                const tbody = document.querySelector("#songTable tbody");
                songs.forEach(s => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${s.title}</td>
                        <td>${s.uploader}</td>
                        <td>${s.download_date}</td>
                        <td><a href="/downloads/${s.filename}">Al</a></td>
                    `;
                    tbody.appendChild(tr);
                });
            });
    </script>
</body>
</html>
